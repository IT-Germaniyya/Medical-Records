services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://medical:medical@postgres:5432/medical_records
      STORAGE_ROOT: /var/lib/medical-data
      OUTPUT_ROOT: /var/lib/medical-output
      AI_EXTRACTION_PROVIDER: ${AI_EXTRACTION_PROVIDER:-local_safe}
      AI_EXTRACTION_MODE: ${AI_EXTRACTION_MODE:-patient_level}
      LEGACY_OCR_ENABLED: ${LEGACY_OCR_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MEDICAL_MODEL: ${OPENAI_MEDICAL_MODEL:-gpt-5.6-sol}
      OPENAI_REASONING_MODEL: ${OPENAI_REASONING_MODEL:-gpt-5.6-sol}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-5.6-sol}
      OPENAI_IMAGE_DETAIL: ${OPENAI_IMAGE_DETAIL:-high}
      AI_ALLOW_HIERARCHICAL_FALLBACK: ${AI_ALLOW_HIERARCHICAL_FALLBACK:-true}
      AI_MAX_PATIENT_BYTES: ${AI_MAX_PATIENT_BYTES:-41943040}
      FAST_MODEL_MIN_CONFIDENCE: ${FAST_MODEL_MIN_CONFIDENCE:-0.80}
      AUTO_ACCEPT_CONFIDENCE: ${AUTO_ACCEPT_CONFIDENCE:-0.95}
      PHYSICIAN_REVIEW_CONFIDENCE: ${PHYSICIAN_REVIEW_CONFIDENCE:-0.70}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-4}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-90}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_PAGES_PER_REQUEST: ${AI_PAGES_PER_REQUEST:-3}
      AI_DEBUG: ${AI_DEBUG:-false}
      APP_ENV: ${APP_ENV:-development}
      ADMIN_MODE: ${ADMIN_MODE:-false}
      OPENAI_PROMPT_ROOT: /service/prompts/openai
    volumes:
      - ./data:/var/lib/medical-data
      - ./output:/var/lib/medical-output
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://medical:medical@postgres:5432/medical_records
      STORAGE_ROOT: /var/lib/medical-data
      OUTPUT_ROOT: /var/lib/medical-output
      BATCH_INPUT: /var/lib/medical-data/incoming/patients
      AI_EXTRACTION_PROVIDER: ${AI_EXTRACTION_PROVIDER:-local_safe}
      AI_EXTRACTION_MODE: ${AI_EXTRACTION_MODE:-patient_level}
      LEGACY_OCR_ENABLED: ${LEGACY_OCR_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MEDICAL_MODEL: ${OPENAI_MEDICAL_MODEL:-gpt-5.6-sol}
      OPENAI_REASONING_MODEL: ${OPENAI_REASONING_MODEL:-gpt-5.6-sol}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-5.6-sol}
      OPENAI_IMAGE_DETAIL: ${OPENAI_IMAGE_DETAIL:-high}
      AI_ALLOW_HIERARCHICAL_FALLBACK: ${AI_ALLOW_HIERARCHICAL_FALLBACK:-true}
      AI_MAX_PATIENT_BYTES: ${AI_MAX_PATIENT_BYTES:-41943040}
      FAST_MODEL_MIN_CONFIDENCE: ${FAST_MODEL_MIN_CONFIDENCE:-0.80}
      AUTO_ACCEPT_CONFIDENCE: ${AUTO_ACCEPT_CONFIDENCE:-0.95}
      PHYSICIAN_REVIEW_CONFIDENCE: ${PHYSICIAN_REVIEW_CONFIDENCE:-0.70}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-4}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-90}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_PAGES_PER_REQUEST: ${AI_PAGES_PER_REQUEST:-3}
      AI_DEBUG: ${AI_DEBUG:-false}
      APP_ENV: ${APP_ENV:-development}
      ADMIN_MODE: ${ADMIN_MODE:-false}
      OPENAI_PROMPT_ROOT: /service/prompts/openai
    volumes:
      - ./data:/var/lib/medical-data
      - ./output:/var/lib/medical-output
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medical_records
      POSTGRES_USER: medical
      POSTGRES_PASSWORD: medical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical -d medical_records"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
