  <script>
    window.Swal=window.Swal||(()=>{let active=null;const symbols={warning:'!',success:'✓',error:'×',info:'i'};const fire=options=>new Promise(resolve=>{const overlay=document.createElement('div');overlay.className='swal2-container';const popup=document.createElement('div');popup.className='swal2-popup';const icon=options.icon&&symbols[options.icon]?'<div class="swal2-icon swal2-'+options.icon+'">'+symbols[options.icon]+'</div>':'';const title=options.title?'<div class="swal2-title">'+String(options.title)+'</div>':'';const message=options.html?'<div class="swal2-html-container">'+options.html+'</div>':'<div class="swal2-html-container">'+String(options.text||'')+'</div>';const input=options.input?'<input class="swal2-input" value="'+String(options.inputValue||'').replace(/"/g,'&quot;')+'" placeholder="'+String(options.inputPlaceholder||'')+'">':'';const validation='<div class="swal2-validation-message" hidden></div>';const cancel=options.showCancelButton?'<button type="button" class="swal2-cancel">'+(options.cancelButtonText||'Cancel')+'</button>':'';const confirm=options.showConfirmButton===false?'':'<button type="button" class="swal2-confirm" style="background:'+(options.confirmButtonColor||'#087f8c')+'">'+(options.confirmButtonText||'OK')+'</button>';popup.innerHTML=icon+title+message+input+validation+'<div class="swal2-actions">'+(options.reverseButtons?cancel+confirm:confirm+cancel)+'</div>';overlay.appendChild(popup);document.body.appendChild(overlay);active=overlay;let closed=false;const close=result=>{if(closed)return;closed=true;overlay.remove();if(active===overlay)active=null;resolve(result);};const cancelButton=popup.querySelector('.swal2-cancel');if(cancelButton)cancelButton.onclick=()=>close({isConfirmed:false,isDismissed:true});const confirmButton=popup.querySelector('.swal2-confirm');if(confirmButton)confirmButton.onclick=async()=>{let value=popup.querySelector('.swal2-input')?.value;try{if(options.preConfirm){const checked=await options.preConfirm(value);if(checked===false)return;value=checked;}}catch(error){showValidationMessage(error.message);return;}close({isConfirmed:true,value});};const showValidationMessage=message=>{const node=popup.querySelector('.swal2-validation-message');if(node){node.textContent=message;node.hidden=false;}};if(options.timer)setTimeout(()=>close({isConfirmed:false,isDismissed:true}),options.timer);});const showValidationMessage=message=>{const node=active?.querySelector('.swal2-validation-message');if(node){node.textContent=message;node.hidden=false;}};return{fire,showValidationMessage};})();
    window.swal=window.swal||((options)=>window.Swal.fire(options));

  <style>

    *{box-sizing:border-box}body{margin:0;min-width:320px}button,input{font:inherit}button{border:0;cursor:pointer;border-radius:7px;padding:.62rem .8rem;background:var(--teal);color:#fff;font-weight:650}button:hover{background:var(--teal-dark)}button.secondary{background:#e8f0f3;color:var(--ink)}button.warning{background:#fff0c8;color:#704b00}button.danger{background:var(--red)}button.small{padding:.4rem .55rem;font-size:.82rem}.shell{min-height:100vh;display:grid;grid-template-rows:64px 1fr}header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:1.8rem;padding:0 2rem}.brand{display:flex;align-items:center;gap:.6rem;font-size:1.05rem;white-space:nowrap}.brand-mark{width:28px;height:28px;border-radius:8px;background:#37b4bc;display:grid;place-items:center;color:#073945;font-weight:900}nav{display:flex;gap:.2rem;flex:1}nav button{background:transparent;color:#d7e7ec;padding:.55rem .72rem}nav button.active,nav button:hover{background:#244663;color:#fff}.user-chip{color:#c5d8df;font-size:.85rem;white-space:nowrap}
    main{padding:1.5rem 2rem 3rem;max-width:1440px;width:100%;margin:0 auto}.page-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1.2rem}h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}h2{font-size:1.05rem;margin:0 0 .75rem}h3{font-size:.95rem;margin:.8rem 0 .35rem}p{line-height:1.45}.muted{color:var(--muted);font-size:.9rem}.eyebrow{color:var(--teal);font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;font-weight:800;margin:0 0 .3rem}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #18384d0d;padding:1.1rem}.grid{display:grid;gap:1rem}.metrics{grid-template-columns:repeat(5,minmax(130px,1fr))}.metric strong{display:block;font-size:1.8rem;color:var(--navy)}.metric span{font-size:.82rem;color:var(--muted)}.metric.alert strong{color:var(--amber)}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.two-col{grid-template-columns:minmax(260px,.8fr) minmax(360px,1.6fr)}.three-col{grid-template-columns:repeat(3,1fr)}

    .doc-layout{display:grid;grid-template-columns:minmax(230px,.75fr) minmax(360px,1.5fr);gap:1rem}.doc-list{display:grid;gap:.55rem;max-height:640px;overflow:auto}.doc-card{border:1px solid var(--line);border-radius:9px;padding:.68rem;cursor:pointer;background:#fff}.doc-card.active{border:2px solid var(--teal);background:#f1fbfb}.doc-title{font-weight:700;font-size:.9rem;overflow-wrap:anywhere}.doc-meta{color:var(--muted);font-size:.76rem;margin-top:.25rem}.filter-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.7rem}.filter-row button{font-size:.76rem;padding:.38rem .5rem}.viewer{min-height:550px;display:flex;flex-direction:column;gap:.55rem}.viewer-frame{flex:1;min-height:460px;background:#edf3f5;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;overflow:auto}.viewer-frame img{max-width:100%;max-height:500px;transition:transform .2s}.viewer-frame iframe{width:100%;height:530px;border:0}.viewer-controls{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}.viewer-controls span{font-size:.8rem;color:var(--muted)}.page-thumbs{display:flex;gap:.45rem;overflow:auto;padding:.25rem 0}.page-thumb{min-width:78px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:.25rem;cursor:pointer;text-align:center;font-size:.7rem;color:var(--muted)}.page-thumb.active{border:2px solid var(--teal);color:var(--teal-dark)}.page-thumb img{width:66px;height:52px;object-fit:cover;display:block;margin:0 auto .2rem}
    .timeline{position:relative;display:grid;gap:.8rem}.timeline:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:#c8e0e3}.event{position:relative;padding-left:30px;cursor:pointer}.event:before{content:"";position:absolute;left:3px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:3px solid #d9f0f1}.event-date{color:var(--teal-dark);font-weight:750;font-size:.85rem}.event-title{font-weight:700;margin:.12rem 0}.review-card{border:1px solid #ead8a4;background:#fffdf6;border-radius:9px;padding:.85rem}.review-card+.review-card{margin-top:.65rem}.review-card h3{margin-top:0}.review-actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.65rem}.report-row{display:flex;justify-content:space-between;gap:1rem;align-items:center;border-bottom:1px solid var(--line);padding:.8rem 0}.report-row:last-child{border-bottom:0}.report-type{font-weight:750}.report-version{color:var(--muted);font-size:.84rem}.report-actions{display:flex;gap:.4rem;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.82rem}.field{display:grid;gap:.3rem}.field label{font-size:.77rem;color:var(--muted);font-weight:700}.field.full{grid-column:1/-1}.field input[type=file]{padding:.5rem}.progress{height:8px;background:#e5eef1;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal);transition:width .2s}.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}.error{color:var(--red);background:#fff0f0;border:1px solid #f0c5c8;padding:.75rem;border-radius:7px}
    @media(max-width:950px){header{padding:0 1rem;gap:.8rem}nav button{padding:.5rem;font-size:.78rem}.user-chip{display:none}main{padding:1.1rem}.metrics{grid-template-columns:repeat(3,1fr)}.two-col,.doc-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){header{height:auto;min-height:64px;flex-wrap:wrap;padding:.7rem 1rem}nav{order:3;width:100%;overflow:auto}.shell{grid-template-rows:auto 1fr}.page-head,.workspace-head{flex-direction:column}.metrics,.three-col{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.key-value{grid-template-columns:1fr}.viewer{min-height:400px}.viewer-frame{min-height:320px}}

<body>
<div class="shell"><header><div class="brand"><span class="brand-mark">+</span><span>MedRecords</span></div><nav id="nav"><button data-route="dashboard">Dashboard</button><button data-route="patients">Patients</button><button data-route="reports">Reports</button><button data-route="upload">Add patient</button></nav><span class="user-chip">Hospital workspace</span></header><main id="app"><div class="empty">Loading workspace…</div></main></div>
<script>
const state={record:null,patientQuery:'',reportDate:'',reportType:'',selectedFile:null,selectedPage:1,zoom:1,rotation:0,documentFilter:'all'};
const api='/api';
const esc=value=>{const node=document.createElement('span');node.textContent=value??'';return node.innerHTML;};
const valueOf=item=>item&&item.value!=null?item.value:'Not documented';
const fmtDate=value=>value?new Date(value).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Not documented';
const patientName=record=>valueOf(record.patient.full_name)==='Not documented'?record.patient.patient_id:valueOf(record.patient.full_name);
const initials=name=>(name||'P').split(/\s+/).slice(0,2).map(part=>part[0]).join('').toUpperCase();
const badge=(value,kind)=>'<span class="status '+(kind||'')+'">'+esc(value)+'</span>';
async function get(path){const response=await fetch(api+path);if(!response.ok)throw new Error((await response.json().catch(()=>({}))).detail||'Request failed');return response.json();}
async function post(path,body){const response=await fetch(api+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!response.ok)throw new Error((await response.json().catch(()=>({}))).detail||'Request failed');return response.json();}
function navigate(route){location.hash=route;}
function setNav(route){const root=route.split('/')[0];document.querySelectorAll('#nav button').forEach(button=>button.classList.toggle('active',button.dataset.route===root));}
function head(title,subtitle,actions){return '<div class="page-head"><div><p class="eyebrow">Clinical workspace</p><h1>'+esc(title)+'</h1><p class="muted">'+esc(subtitle||'')+'</p></div><div class="actions">'+(actions||'')+'</div></div>';}
function bindCommon(){document.querySelectorAll('[data-route-action="upload"]').forEach(node=>node.onclick=()=>navigate('upload'));document.querySelectorAll('[data-route-action="patients"]').forEach(node=>node.onclick=()=>navigate('patients'));document.querySelectorAll('[data-route-action="reports"]').forEach(node=>node.onclick=()=>navigate('reports'));document.querySelectorAll('[data-route-action="add-existing"]').forEach(node=>node.onclick=()=>navigate('upload?patient_id='+encodeURIComponent(node.dataset.patientId)));}
function errorView(error){document.querySelector('#app').innerHTML='<div class="error">'+esc(error.message||error)+'</div>';}
async function dashboard(){setNav('dashboard');const data=await get('/dashboard');let recent='';data.recent_patients.forEach(item=>{recent+='<tr class="clickable" data-patient="'+esc(item.patient_id)+'"><td><b>'+esc(item.patient_name||item.patient_id)+'</b><br><span class="muted">'+esc(item.hospital_file_number||item.patient_id)+'</span></td><td>'+badge(item.processing_status,item.processing_status==='completed_with_warnings'?'warn':'')+'</td><td>'+badge(item.review_status,item.review_status==='pending'?'warn':'')+'</td></tr>';});const recentBlock=recent?'<div class="table-wrap"><table><thead><tr><th>Patient</th><th>Status</th><th>Review</th></tr></thead><tbody>'+recent+'</tbody></table></div>':'<div class="empty">No patients yet.</div>';document.querySelector('#app').innerHTML=head('Dashboard','A clear starting point for patient records and review work.','<button data-route-action="upload">Add patient</button><button class="secondary" data-route-action="patients">Search patients</button>')+'<div class="grid metrics"><div class="card metric"><strong>'+data.total_patients+'</strong><span>Total patients</span></div><div class="card metric"><strong>'+data.processed_patients+'</strong><span>Processed</span></div><div class="card metric alert"><strong>'+data.pending_review+'</strong><span>Pending review</span></div><div class="card metric"><strong>'+data.reports_generated+'</strong><span>Reports generated</span></div><div class="card metric"><strong>'+data.failed_processing+'</strong><span>Failed processing</span></div></div><div class="grid two-col" style="margin-top:1rem"><div class="card"><h2>Recent patients</h2>'+recentBlock+'</div><div class="card"><h2>Safe workflow</h2><p class="muted">Search or add a patient, review only uncertain fields, then generate the detailed medical report or the compact ERP summary. Every extracted fact retains its source page.</p><div class="alert">Unverified diagnoses, medication details, dates, and image-only pages remain clearly marked for review.</div></div></div>';bindCommon();document.querySelectorAll('[data-patient]').forEach(node=>node.onclick=()=>navigate('patients/'+encodeURIComponent(node.dataset.patient)));}
async function dashboard(){setNav('dashboard');const data=await get('/dashboard');let recent='';data.recent_patients.forEach(item=>{recent+='<tr class="clickable" data-patient="'+esc(item.patient_id)+'"><td><b>'+esc(item.patient_name||item.patient_id)+'</b><br><span class="muted">'+esc(item.hospital_file_number||item.patient_id)+'</span></td><td>'+badge(item.processing_status,item.processing_status==='completed_with_warnings'?'warn':'')+'</td><td>'+badge(item.review_status,item.review_status==='pending'?'warn':'')+'</td></tr>';});const patientBlock=recent?'<div class="table-wrap"><table><thead><tr><th>Patient</th><th>Status</th><th>Review</th></tr></thead><tbody>'+recent+'</tbody></table></div>':'<div class="empty">No patients yet.</div>';let recentReports='';(data.recent_reports||[]).forEach(item=>{recentReports+='<tr><td><b>'+esc(item.patient_name||item.patient_id)+'</b><br><span class="muted">'+esc(item.hospital_file_number||item.patient_id)+'</span></td><td>'+esc(item.report_type==='detailed_medical_report'?'Detailed Medical Report':'ERP Physician Summary')+' v'+item.version+'</td><td>'+badge(item.status,item.status==='needs_review'?'warn':'')+'</td></tr>';});const reportBlock=recentReports?'<div class="table-wrap"><table><thead><tr><th>Patient</th><th>Report</th><th>Status</th></tr></thead><tbody>'+recentReports+'</tbody></table></div>':'<div class="empty">No reports yet.</div>';document.querySelector('#app').innerHTML=head('Dashboard','A clear starting point for patient records and review work.','<button data-route-action="upload">Add patient</button><button class="secondary" data-route-action="patients">Search patients</button>')+'<div class="grid metrics"><div class="card metric"><strong>'+data.total_patients+'</strong><span>Total patients</span></div><div class="card metric"><strong>'+data.processed_patients+'</strong><span>Processed</span></div><div class="card metric alert"><strong>'+data.pending_review+'</strong><span>Pending review</span></div><div clas async function reports(){setNav('reports');const dateQuery=state.reportDate?'&date='+encodeURIComponent(state.reportDate):'';const typeQuery=state.reportType?'&report_type='+encodeURIComponent(state.reportType):'';const data=await get('/reports?q='+encodeURIComponent(state.patientQuery)+dateQuery+typeQuery);let rows='';data.forEach(item=>{const label=item.patient_name||item.patient_id;rows+='<div class="report-row"><div><div class="report-type">'+esc(label)+'</div><div class="report-version">'+esc(item.hospital_file_number||'MRN not documented')+' · '+esc(item.patient_id)+' · '+(item.report_type==='detailed_medical_report'?'Detailed Medical Report':'ERP Physician Summary')+' v'+item.version+'</div><div class="report-version">'+fmtDate(item.created_at)+' · '+esc(item.created_by)+' · '+badge(item.status,item.status==='needs_review'?'warn':'')+'</div></div><div class="report-actions"><a href="'+api+'/reports/'+item.report_id+'/download" target="_blank"><button class="small">View / Download</button></a>'+(item.report_type==='erp_summary'?'<a href="'+api+'/reports/'+item.report_id+'/json" target="_blank"><button class="small secondary">JSON</button></a>':'')+'<a href="'+api+'/reports/'+item.report_id+'/text" target="_blank"><button class="small secondary">TXT</button></a></div></div>';});document.querySelector('#app').innerHTML=head('Reports','Find detailed medical reports and ERP summaries by patient name, ID, MRN, report type, or report date.','<button data-route-action="patients">Search patients</button>')+'<div class="card"><div class="search-bar"><input id="report-search" value="'+esc(state.patientQuery)+'" placeholder="Search reports"><select id="report-type" aria-label="Filter by report type"><option value="">All report types</option><option value="detailed_medical_report" '+(state.reportType==='detailed_medical_report'?'selected':'')+'>Detailed Medical Report</option><option value="erp_summary" '+(state.reportType==='erp_summary'?'selected':'')+'>ERP Physician Summary</option></select><input id="report-date" type="date" value="'+esc(state.reportDate)+'" aria-label="Filter by report date"><button id="report-search-button">Search</button></div>'+(rows||'<div class="empty">No reports found.</div>')+'</div>';bindCommon();const search=()=>{state.patientQuery=document.querySelector('#report-search').value.trim();state.reportDate=document.querySelector('#report-date').value;state.reportType=document.querySelector('#report-type').value;reports().catch(errorView);};document.querySelector('#report-search-button').onclick=search;document.querySelector('#report-search').onkeydown=event=>{if(event.key==='Enter')search();};document.querySelector('#report-date').onchange=search;document.querySelector('#report-type').onchange=search;}
function upload(existingId){setNav('upload');document.querySelector('#app').innerHTML=head(existingId?'Add documents to patient':'Add patient / upload records','Upload JPG, PNG, PDF, or ZIP files. Processing runs in the background; originals are preserved.','<button class="secondary" data-route-action="patients">Back to patients</button>')+'<div class="card"><form id="upload-form"><div class="form-grid"><div class="field"><label>Patient ID</label><input name="patient_id" value="'+esc(existingId||'')+'" '+(existingId?'readonly':'')+' placeholder="P00001821"></div><div class="field"><label>Patient name</label><input name="patient_name" placeholder="Mohamed Khaled Ahmed"></div><div class="field"><label>Hospital file number / MRN</label><input name="hospital_file_number" placeholder="26/09432"></div><div class="field"><label>Sex</label><input name="sex" placeholder="Female / Male"></div><div class="field"><label>Date of birth</label><input name="date_of_birth" placeholder="YYYY-MM-DD"></div><div class="field"><label>Nationality</label><input name="nationality"></div><div class="field full"><label>Records</label><input name="files" type="file" accept=".jpg,.jpeg,.png,.pdf,.zip" multiple required><span class="muted">Multiple source files are supported. A ZIP must contain one patient folder at its root.</span></div></div><div class="actions" style="margin-top:1rem"><button type="submit">Process patient</button></div></form><div id="upload-job"></div></div>';bindCommon();document.querySelector('#upload-form').onsubmit=async event=>{event.preventDefault();const response=await fetch(api+'/uploads',{method:'POST',body:new FormData(event.target)});if(!response.ok){alert((await response.json()).detail||'Upload failed');return;}pollJob(await response.json(),job=>{if(job.patient_id)navigate('patients/'+encodeURIComponent(job.patient_id));},document.querySelector('#upload-job'));};}
function pollJob(initial,onComplete,target){target=target||document.querySelector('#upload-job');target.innerHTML='<div class="card"><b>'+esc(initial.message)+'</b><p class="muted">You can continue working while this runs.</p><div class="progress"><i style="width:'+initial.progress+'%"></i></div><p class="muted" data-job-message>Queued…</p></div>';let attempts=0;const poll=async()=>{const job=await get('/jobs/'+initial.job_id);target.querySelector('.progress i').style.width=job.progress+'%';target.querySelector('[data-job-message]').textContent=job.message;if(job.status==='complete'){onComplete(job);return;}if(job.status==='failed'){target.querySelector('[data-job-message]').textContent='Processing failed. Source files were preserved for review.';return;}if(attempts++<120)setTimeout(poll,1000);};poll().catch(error=>target.querySelector('[data-job-message]').textContent=error.message);}
async function workspaceTab(record,tab){const root=document.querySelector('#workspace-content');if(tab==='overview')return overview(root,record);if(tab==='documents')return documents(root,record);if(tab==='timeline')return timeline(root,record);if(tab==='problems')return root.innerHTML=tableCard('Problem list',['Problem','Status','Source type'],record.problem_list.map(item=>[item.problem,item.status,item.source_type]));if(tab==='labs')return root.innerHTML=tableCard('Laboratory results',['Test','Value as documented','Unit','Date','Source'],record.laboratory_results.map(item=>[item.test_name_original,item.value_text||item.value,item.unit||'—',item.date||'Not documented',item.source_ref.source_file+' p'+item.source_ref.source_page]));if(tab==='medications')return root.innerHTML=tableCard('Medication history',['Name','Strength','Dose','Frequency','Confidence','Source'],record.medications.map(item=>[item.name_original||'Unidentified',item.strength||'—',item.dose||'Not documented',item.frequency||'Not documented',Math.round(item.confidence*100)+'%',item.source_ref.source_file+' p'+item.source_ref.source_page]));if(tab==='growth')return root.innerHTML=tableCard('Growth / vitals',['Date','Weight kg','Height cm','Head circumference cm','Source'],record.growth_measurements.map(item=>[item.date||'Not documented',item.weight_kg||'—',item.height_cm||'—',item.head_circumference_cm||'—',item.source.source_file+' p'+item.source.source_page]));if(tab==='review')return review(root,record);if(tab==='reports')return patientReports(root,record);}
async function render(){try{const raw=location.hash.replace(/^#/,'')||'dashboard';const parts=raw.split('?');const path=parts[0];const params=new URLSearchParams(parts[1]||'');if(path==='dashboard')return dashboard();if(path==='patients')return patients();if(path==='reports')return reports();if(path==='upload')return upload(params.get('patient_id'));if(path.startsWith('patients/'))return workspace(decodeURIComponent(path.split('/')[1]),params.get('tab')||'overview');return dashboard();}catch(error){errorView(error);}}
async function remove(path){const response=await fetch(api+path,{method:'DELETE'});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.detail||'Delete request failed');return payload;}
async function swalFire(options){if(window.Swal&&typeof window.Swal.fire==='function')return Swal.fire(options);if(options.input){const value=window.prompt(options.text||options.title||'',options.inputValue||'');return{isConfirmed:value!==null,value};}const accepted=window.confirm(options.text||options.title||'Continue?');return{isConfirmed:accepted};}

function adjustMetric(label,delta){const metric=Array.from(document.querySelectorAll('.metric')).find(node=>node.querySelector('span')?.textContent.trim()===label);if(!metric)return;const value=Number(metric.querySelector('strong')?.textContent||0);if(Number.isFinite(value))metric.querySelector('strong').textContent=String(Math.max(0,value+delta));}
function renderDeletedWorkspace(){state.record=null;history.replaceState(null,'','#patients');setNav('patients');document.querySelector('#app').innerHTML='<div class="card"><h2>Patient record deleted</h2><p class="muted">The patient record, source documents, and generated reports were removed.</p><div class="actions"><button data-route-action="patients">Back to patients</button><button class="secondary" data-route-action="upload">Add patient</button></div></div>';bindCommon();}
function syncDeletedPatient(patientId,context={}){if(location.hash.startsWith('#patients/')){renderDeletedWorkspace();return;}const nodes=Array.from(document.querySelectorAll('tr[data-patient],tr[data-report-patient]')).filter(node=>node.dataset.patient===patientId||node.dataset.reportPatient===patientId);nodes.forEach(node=>node.remove());document.querySelectorAll('table tbody').forEach(body=>{if(!body.querySelector('tr')){const count=body.closest('table')?.querySelectorAll('thead th').length||1;body.innerHTML='<tr><td colspan="'+count+'"><div class="empty">No records found.</div></td></tr>';}});if(context.dashboard){adjustMetric('Total patients',-1);if(['completed','completed_with_warnings'].includes(context.processingStatus))adjustMetric('Processed',-1);if(['pending','processing'].includes(context.processingStatus))adjustMetric('Pending extraction',-1);if(context.processingStatus==='failed')adjustMetric('Failed processing',-1);if(context.reviewStatus==='pending')adjustMetric('Pending review',-1);adjustMetric('Reports generated',-(Number(context.reportCount)||0));}}
function syncDeletedAll(){if(location.hash.startsWith('#patients/')){history.replaceState(null,'','#dashboard');setNav('dashboard');document.querySelector('#app').innerHTML='<div class="card"><h2>All patient records deleted</h2><p class="muted">All patient records, source documents, generated reports, and related jobs were removed.</p><div class="actions"><button data-route-action="upload">Add patient</button><button class="secondary" data-route-action="patients">View patients</button></div></div>';bindCommon();return;}document.querySelectorAll('.metric strong').forEach(node=>{node.textContent='0';});document.querySelectorAll('table tbody').forEach(body=>{const count=body.closest('table')?.querySelectorAll('thead th').length||1;body.innerHTML='<tr><td colspan="'+count+'"><div class="empty">No records found.</div></td></tr>';});document.querySelectorAll('[data-delete-patient]').forEach(node=>node.remove());}

function addDashboardRowActions(){const tables=Array.from(document.querySelectorAll('.table-wrap table'));const headerText=table=>table.querySelector('thead')?.textContent.toLowerCase()||'';const patientTable=tables.find(table=>headerText(table).includes('patient')&&headerText(table).includes('review'));if(!patientTable)return;const reportTable=tables.find(table=>table!==patientTable&&headerText(table).includes('report'));const patientRows=Array.from(patientTable.querySelectorAll('tbody tr[data-patient]'));if(reportTable){const reportRows=Array.from(reportTable.querySelectorAll('tbody tr'));reportRows.forEach(row=>{if(row.dataset.reportPatient)return;const reportText=row.querySelector('td')?.textContent.trim()||'';const match=patientRows.find(candidate=>(candidate.querySelector('td')?.textContent.trim()||'')===reportText);if(match)row.dataset.reportPatient=match.dataset.patient;});}const header=patientTable.querySelector('thead tr');if(header&&!header.querySelector('[data-delete-column]'))header.insertAdjacentHTML('beforeend','<th data-delete-column>Actions</th>');patientRows.forEach(row=>{if(row.querySelector('[data-delete-patient]'))return;const name=row.querySelector('b')?.textContent||row.dataset.patient;const cell=document.createElement('td');const reportCount=reportTable?Array.from(reportTable.querySelectorAll('tbody tr')).filter(reportRow=>reportRow.dataset.reportPatient===row.dataset.patient).length:0;cell.innerHTML='<button class="small danger" data-delete-patient="'+esc(row.dataset.patient)+'" data-patient-name="'+esc(name)+'" data-dashboard="1" data-processing-status="'+esc(row.cells[1]?.textContent.trim()||'')+'" data-review-status="'+esc(row.cells[2]?.textContent.trim()||'')+'" data-report-count="'+reportCount+'">Delete</button>';row.appendChild(cell);});bindDeleteControls();}

function upload(existingId){setNav('upload');document.querySelector('#app').innerHTML=head(existingId?'Add documents to patient':'Add patient / upload records','Upload archive or records. ZIP and RAR follow the same workflow and are detected automatically.','<button class="secondary" data-route-action="patients">Back to patients</button>')+'<div class="card"><form id="upload-form"><div class="form-grid"><div class="field"><label>Patient ID</label><input name="patient_id" value="'+esc(existingId||'')+'" '+(existingId?'readonly':'')+' placeholder="P00001821"></div><div class="field"><label>Patient name</label><input name="patient_name" placeholder="Mohamed Khaled Ahmed"></div><div class="field"><label>Hospital file number / MRN</label><input name="hospital_file_number" placeholder="26/09432"></div><div class="field"><label>Sex</label><input name="sex" placeholder="Female / Male"></div><div class="field"><label>Date of birth</label><input name="date_of_birth" placeholder="YYYY-MM-DD"></div><div class="field"><label>Nationality</label><input name="nationality"></div><div class="field full"><label>Upload archive</label><input name="files" type="file" accept=".jpg,.jpeg,.png,.pdf,.zip,.rar" multiple required><span class="muted">Upload JPG, PNG, PDF, ZIP, or RAR files. The system detects ZIP/RAR automatically.</span><div id="selected-files" class="selected-files"></div></div></div><div class="actions" style="margin-top:1rem"><button type="submit">Process patient</button></div></form><div id="upload-job"></div></div>';bindCommon();const picker=document.querySelector('#upload-form input[name="files"]');picker.onchange=()=>{document.querySelector('#selected-files').innerHTML=Array.from(picker.files||[]).map(file=>'<div class="selected-file"><b>'+esc(file.name)+'</b><span>'+archiveLabel(file.name)+' · '+formatFileSize(file.size)+'</span></div>').join('');};document.querySelector('#upload-form').onsubmit=async event=>{event.preventDefault();const response=await fetch(api+'/uplo function pollJob(initial,onComplete,target){target=target||document.querySelector('#upload-job');target.innerHTML='<div class="card"><b>'+esc(initial.message)+'</b><p class="muted">You can continue working while this runs.</p><div class="progress"><i style="width:'+initial.progress+'%"></i></div><p class="muted" data-job-message>Queued…</p></div>';let attempts=0;const poll=async()=>{const job=await get('/jobs/'+initial.job_id);const progress=target.querySelector('.progress i');const message=target.querySelector('[data-job-message]');if(progress)progress.style.width=job.progress+'%';if(message)message.textContent=job.message;if(job.status==='complete'){onComplete(job);return;}if(job.status==='failed'){target.innerHTML='<div class="card alert red"><h3>'+esc(job.error||'Unable to extract archive')+'</h3><p>'+esc(job.message)+'</p></div>';toast((job.error?job.error+': ':'')+job.message,'error');return;}if(attempts++<120)setTimeout(poll,1000);};poll().catch(error=>{target.querySelector('[data-job-message]').textContent=error.message;toast(error.message,'error');});}
const originalWorkspaceTab=workspaceTab;
workspaceTab=async function(record,tab){if(tab!=='ai-review')return originalWorkspaceTab(record,tab);const root=document.querySelector('#workspace-content');const ai=record.ai_clinical_review||{};if(!Object.keys(ai).length){root.innerHTML='<div class="card"><h2>AI Clinical Review</h2><p class="muted">No patient-level AI review is available yet. Configure the selected AI provider, pass both connection tests, then use Reprocess with AI.</p></div>';return;}const list=items=>Array.isArray(items)&&items.length?'<ul>'+items.map(item=>'<li>'+esc(typeof item==='string'?item:(item.value||item.summary||item.name||item.problem||item.diagnosis||JSON.stringify(item)))+'</li>').join('')+'</ul>':'<p class="muted">None documented.</p>';const markdown=value=>value?'<div class="review-markdown">'+esc(value)+'</div>':'<p class="muted">Not available.</p>';root.innerHTML='<div class="grid two-col"><div class="card"><h2>Clinical Summary</h2>'+markdown(ai.detailed_report_markdown||ai.erp_summary_markdown)+'</div><div class="card"><h2>Documented Diagnoses</h2>'+list(ai.diagnoses_documented)+'</div></div><div class="grid two-col" style="margin-top:1rem"><div class="card"><h2>Active Problems</h2>'+list(ai.active_problems)+'</div><div class="card"><h2>Key Investigations</h2>'+list(ai.laboratory_results)+'</div><div class="card"><h2>Medication History</h2>'+list(ai.medications)+'</div><div class="card"><h2>Growth / Pediatric Assessment</h2>'+markdown(ai.growth_interpretation)+'</div></div><div class="card" style="margin-top:1rem"><h2>Uncertain / Illegible Items</h2>'+list(ai.uncertain_items)+'</div><div class="muted" style="margin-top:.8rem">Review version '+esc(record.ai_review_version||'—')+' · '+esc(record.ai_review_model||'—')+'</div>';};
document.addEventListener('click',event=>{const button=event.target.closest('[data-reprocess-ai]');if(!button)return;event.preventDefault();fetch(api+'/patients/'+encodeURIComponent(button.dataset.reprocessAi)+'/ai-review/reprocess',{method:'POST'}).then(async response=>{if(!response.ok)throw new Error((await response.json().catch(()=>({}))).detail||'Unable to reprocess with AI');return response.json();}).then(job=>pollJob(job,()=>{toast('Clinical extraction complete','success');workspace(button.dataset.reprocessAi,'ai-review').catch(errorView);})).catch(error=>toast(error.message,'error'));});

// Safe AI diagnostics. Technical fields are rendered only when the backend
// explicitly enables development/admin diagnostics.
function diagnosticValue(value){return value===null||value===undefined||value===''?'—':esc(value);}
async function adminDiagnostics(){setNav('admin');let data;try{data=await get('/admin/ai');}catch(error){errorView(error);return;}const technical=data.technical_details||null;const technicalBlock=technical?'<details style="margin-top:1rem"><summary>Technical details</summary><dl class="key-value" style="margin-top:.8rem"><div><dt>Exception type</dt><dd>'+diagnosticValue(technical.last_exception_type)+'</dd></div><div><dt>HTTP status</dt><dd>'+diagnosticValue(technical.http_status)+'</dd></div><div><dt>Request stage</dt><dd>'+diagnosticValue(technical.request_stage)+'</dd></div><div><dt>Retry count</dt><dd>'+diagnosticValue(technical.retry_count)+'</dd></div><div><dt>Timestamp</dt><dd>'+diagnosticValue(technical.timestamp)+'</dd></div></dl></details>':'';document.querySelector('#app').innerHTML=head('AI diagnostics','Safe provider checks. No API keys, authorization headers, request payloads, or patient data are shown.','<button class="secondary" data-route-action="dashboard">Back to dashboard</button>')+'<div class="grid two-col"><div class="card"><h2>Configuration</h2><dl class="key-value"><div><dt>Provider</dt><dd>'+diagnosticValue(data.provider)+'</dd></div><div><dt>Model</dt><dd>'+diagnosticValue(data.model)+'</dd></div><div><dt>API key configured</dt><dd>'+badge(data.api_key_configured?'Yes':'No',data.api_key_configured?'':'warn')+'</dd></div><div><dt>Worker sees API key</dt><dd>'+badge(data.worker_api_key_configured?'Yes':'No',data.worker_api_key_configured?'':'warn')+'</dd></div><div><dt>Patient processing readiness</dt><dd>'+badge(data.ready_for_patient_processing?'Ready':'Run both tests first',data.ready_for_patient_processing?'':'warn')+'</dd></div></dl></div><div class="card"><h2>Last request</h2><dl class="key-value"><div><dt>Status</dt><dd>'+diagnosticValue(data.last_request_status)+'</dd></div><div><dt>Last error code</dt><dd>'+diagnosticValue(data.last_error_code)+'</dd></div><div><dt>Last error message</dt><dd>'+diagnosticValue(data.last_error_message)+'</dd></div><div><dt>Last successful request</dt><dd>'+diagnosticValue(data.last_successful_request)+'</dd></div><div><dt>Average latency</dt><dd>'+diagnosticValue(data.average_latency_ms)+' ms</dd></div></dl>'+technicalBlock+'</div></div><div class="card" style="margin-top:1rem"><h2>Connection tests</h2><p class="muted">Both tests must succeed before patient-level processing is allowed.</p><div class="actions"><button id="test-ai-connection">Test AI Connection</button><button id="test-ai-vision">Test Vision Extraction</button></div><div id="ai-test-result" style="margin-top:.8rem"></div></div>';bindCommon();const resultNode=document.querySelector('#ai-test-result');const runTest=async(stage,path)=>{resultNode.innerHTML='<p class="muted">Running '+esc(stage)+'…</p>';try{const response=await fetch(api+path,{method:'POST'});const payload=await response.json().catch(()=>({}));if(!response.ok){const detail=payload.detail;const message=typeof detail==='object'?(detail.message||'AI test failed'):(detail||'AI test failed');throw new Error(message);}resultNode.innerHTML='<div class="alert" style="border-color:#2b9270;background:#edf9f3">'+esc(payload.message||'AI test succeeded')+'</div>';await adminDiagnostics();}catch(error){resultNode.innerHTML='<div class="alert red"><b>'+esc(error.message||error)+'</b><p class="muted">Open Technical details for safe server-side diagnostics when enabled.</p></div>';}};document.querySelector('#test-ai-connection').onclick=()=>runTest('text connection','/admin/ai/test-connection');document.querySelector('#test-ai-vision').onclick=()=>runTest('vision extraction','/admin/ai/test-vision');}

// OpenRouter administration and provider comparison. Switching remains
// configuration-based: the selector documents the active setting but never
// mutates secrets or runtime state from the browser.
function comparisonValue(value){if(value===null||value===undefined)return '—';if(typeof value==='string')return value||'—';return JSON.stringify(value,null,2);}
function comparisonCard(provider,result){if(!result)return '<div class="card"><h2>'+esc(provider)+'</h2><p class="muted">No result returned.</p></div>';if(result.status!=='success')return '<div class="card"><h2>'+esc(provider)+'</h2><div class="alert red">'+esc(result.message||'Provider comparison failed')+'</div></div>';const review=result.review||{};const fields=[['Demographics',review.patient],['Diagnoses',review.diagnoses_documented],['Medications',review.medications],['Labs',review.laboratory_results],['Growth extraction',review.growth_measurements],['Uncertain items',review.uncertain_items],['ERP summary',review.erp_summary_markdown]];return '<div class="card"><h2>'+esc(provider)+' <span class="muted">('+esc(result.model||'configured model')+')</span></h2>'+fields.map(field=>'<div style="margin-top:.8rem"><b>'+esc(field[0])+'</b><pre style="white-space:pre-wrap;overflow:auto;margin:.3rem 0 0;font-size:.8rem">'+esc(comparisonValue(field[1]))+'</pre></div>').join('')+'</div>';}
async function runProviderComparison(){const input=document.querySelector('#comparison-patient-id');const resultNode=document.querySelector('#comparison-result');const patientId=(input?.value||'').trim();if(!patientId){resultNode.innerHTML='<div class="alert">Enter a patient ID to compare.</div>';return;}resultNode.innerHTML='<p class="muted">Running both providers on a de-identified structured record…</p>';try{const response=await fetch(api+'/admin/ai/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patient_id:patientId})});const payload=await response.json().catch(()=>({}));if(!response.ok){const detail=payload.detail;throw new Error(typeof detail==='object'?(detail.message||'Comparison failed'):(detail||'Comparison failed'));}resultNode.innerHTML='<div class="alert">De-identified comparison complete. No result is selected automatically.</div><div class="grid two-col" style="margin-top:1rem">'+comparisonCard('OpenAI',payload.results?.openai)+comparisonCard('OpenRouter',payload.results?.openrouter)+'</div>'; }catch(error){resultNode.innerHTML='<div class="alert red">'+esc(error.message||error)+'</div>';}}
const originalAdminDiagnostics=adminDiagnostics;
adminDiagnostics=async function(){await originalAdminDiagnostics();const appRoot=document.querySelector('#app');if(!appRoot)return;const data=await get('/admin/ai').catch(()=>null);if(!data)return;const configurationCard=appRoot.querySelector('.grid.two-col .card');if(configurationCard){const selector=document.createElement('div');selector.style.marginTop='1rem';selector.innerHTML='<label class="field"><span class="field label">Configured provider</span><select id="ai-provider-select" style="min-height:42px;border:1px solid #adc3cd;border-radius:7px;padding:.62rem .72rem;background:#fff;color:var(--ink)"><option value="openai">OpenAI</option><option value="openrouter">OpenRouter</option></select></label><p class="muted" style="margin:.5rem 0 0">Provider switching is configuration-based. Set <code>AI_PROVIDER</code> and restart the API and worker containers.</p>'+(data.configured_provider==='openrouter'&&data.configured_model==='openrouter/free'?'<div class="alert" style="margin-top:.7rem">Free routing may use different models between requests. Extraction quality can vary.</div>':'') ;configurationCard.appendChild(selector);const select=selector.querySelector('#ai-provider-select');select.value=data.configured_provider==='openrouter'?'openrouter':'openai';select.onchange=()=>{select.value=data.configured_provider==='openrouter'?'openrouter':'openai';toast('Provider selection is controlled by AI_PROVIDER in the environment. Restart API and worker after changing it.','warning');};}
const comparison=document.createElement('div');comparison.className='card';comparison.style.marginTop='1rem';comparison.innerHTML='<h2>Compare providers</h2><p class="muted">Run the same de-identified structured patient record through OpenAI and OpenRouter. This is for review only; the application never automatically selects the cheaper or higher-scoring result.</p><div class="actions"><input id="comparison-patient-id" placeholder="Patient ID" style="min-height:42px;border:1px solid #adc3cd;border-radius:7px;padding:.62rem .72rem;flex:1;min-width:220px"><button id="compare-ai-providers">Compare OpenAI vs OpenRouter</button></div><div id="comparison-result" style="margin-top:1rem"></div>';appRoot.appendChild(comparison);document.querySelector('#compare-ai-providers').onclick=runProviderComparison;};
const localAwareAdminDiagnostics=adminDiagnostics;
adminDiagnostics=async function(){await localAwareAdminDiagnostics();const appRoot=document.querySelector('#app');if(!appRoot)return;const data=await get('/admin/ai').catch(()=>null);if(!data)return;const provider=(data.configured_provider||data.provider||'').toLowerCase();const select=appRoot.querySelector('#ai-provider-select');if(select){if(!Array.from(select.options).some(option=>option.value==='local'))select.insertAdjacentHTML('beforeend','<option value="local">Local AI</option>');select.value=provider.startsWith('local')||provider==='ollama'?'local':provider.startsWith('openrouter')?'openrouter':'openai';select.onchange=()=>{select.value=provider.startsWith('local')||provider==='ollama'?'local':provider.startsWith('openrouter')?'openrouter':'openai';toast('Provider selection is controlled by AI_PROVIDER in the environment. Restart API and worker after changing it.','warning');};}
if(provider.startsWith('local')||provider==='ollama'){const local=data.local_ai||{};const localCard=document.createElement('div');localCard.className='card';localCard.style.marginTop='1rem';localCard.innerHTML='<h2>Local AI runtime</h2><dl class="key-value"><div><dt>Provider</dt><dd>Local AI</dd></div><div><dt>Model</dt><dd>'+diagnosticValue(data.configured_model||local.model)+'</dd></div><div><dt>Ollama status</dt><dd>'+badge(local.status||data.ollama_status||'unknown',local.status==='healthy'?'':'warn')+'</dd></div><div><dt>GPU status</dt><dd>'+diagnosticValue(local.gpu_status||data.gpu_status)+'</dd></div><div><dt>GPU memory</dt><dd>'+diagnosticValue(local.gpu_memory_bytes??data.gpu_memory_bytes)+'</dd></div><div><dt>Page latency</dt><dd>'+diagnosticValue(data.page_latency_ms)+' ms</dd></div><div><dt>Patient latency</dt><dd>'+diagnosticValue(data.patient_latency_ms)+' ms</dd></div><div><dt>OCR augmentation</dt><dd>'+diagnosticValue(local.ocr_enabled?'Enabled':'Disabled')+'</dd></div></dl><p class="muted">Local AI sends images only to the configured Ollama endpoint. Cloud providers are never used as a fallback.</p>';appRoot.appendChild(localCard);const textButton=appRoot.querySelector('#test-ai-connection');if(textButton)textButton.textContent='Test Ollama Connection';const visionButton=appRoot.querySelector('#test-ai-vision');if(visionButton)visionButton.textContent='Test Vision Extraction';}
if(provider.startsWith('local')||provider==='ollama'){appRoot.querySelectorAll('.key-value > div').forEach(row=>{const label=row.querySelector('dt')?.textContent?.toLowerCase()||'';if(label==='api key configured'||label==='worker sees api key'){const value=row.querySelector('dd');if(value)value.innerHTML=badge('Not required','');}});}
};
const originalRender=render;
render=async function(){const raw=location.hash.replace(/^#/,'')||'dashboard';if(raw.split('?')[0]==='admin/ai')return adminDiagnostics();return originalRender();};
const originalSetNav=setNav;setNav=function(route){originalSetNav(route==='admin'?'admin/ai':route);};
const adminNavButton=document.createElement('button');adminNavButton.dataset.route='admin/ai';adminNavButton.textContent='AI diagnostics';document.querySelector('#nav').appendChild(adminNavButton);adminNavButton.onclick=()=>navigate('admin/ai');

// Keep failure feedback actionable while preserving the redaction boundary.
pollJob=async function(initial,onComplete,target){target=target||document.querySelector('#upload-job');target.innerHTML='<div class="card"><b>'+esc(initial.message)+'</b><p class="muted">You can continue working while this runs.</p><div class="progress"><i style="width:'+initial.progress+'%"></i></div><p class="muted" data-job-message>Queued…</p></div>';let attempts=0;const poll=async()=>{const job=await get('/jobs/'+initial.job_id);const progress=target.querySelector('.progress i');const message=target.querySelector('[data-job-message]');if(progress)progress.style.width=job.progress+'%';if(message)message.textContent=job.message;if(job.status==='complete'){onComplete(job);return;}if(job.status==='failed'){let technical='';try{const diag=await get('/admin/ai');if(diag.technical_details)technical='<details style="margin-top:.7rem"><summary>Technical details</summary><pre style="white-space:pre-wrap;font-size:.78rem">'+esc(JSON.stringify(diag.technical_details,null,2))+'</pre></details>';}catch(error){}target.innerHTML='<div class="card alert red"><h3>'+esc(job.error||'AI processing failed')+'</h3><p>'+esc(job.message)+'</p>'+technical+'</div>';toast((job.error?job.error+': ':'')+job.message,'error');return;}if(attempts++<120)setTimeout(poll,1000);};poll().catch(error=>{const node=target.querySelector('[data-job-message]');if(node)node.textContent=error.message;toast(error.message,'error');});};
render();
</script>
</body>
